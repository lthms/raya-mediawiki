ServerName localhost
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    AllowEncodedSlashes NoDecode
    Timeout 60
    LimitRequestBody 31457280
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Content-Type-Options "nosniff"
    # Keep wiki responses private; let ResourceLoader manage CSS/JS caching.
    Header always set Cache-Control "private, no-store" "expr=%{REQUEST_URI} != '/load.php'"
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        AcceptPathInfo On
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>
    <LocationMatch "^/(mw-config|maintenance|tests|vendor|cache|images)(/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "^(LocalSettings\.php|composer\.(json|lock))$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>
